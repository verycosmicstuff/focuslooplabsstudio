<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Rounded Squircle Dark Container -->
  <rect width="100" height="100" rx="24" fill="#090d16" />
  
  <!-- Left Arc (sweeps clockwise up to top) -->
  <path d="M 45 86 A 36 36 0 0 1 45 14" stroke="#06b6d4" stroke-width="7.5" stroke-linecap="round" />
  <!-- Top Arrowhead -->
  <polygon points="43,6 57,14 43,22" fill="#06b6d4" />

  <!-- Right Arc (sweeps clockwise down to bottom) -->
  <path d="M 55 14 A 36 36 0 0 1 55 86" stroke="#06b6d4" stroke-width="7.5" stroke-linecap="round" />
  <!-- Bottom Arrowhead -->
  <polygon points="57,94 43,86 57,78" fill="#06b6d4" />

  <!-- Centered Bold FLS Monogram -->
  <text x="50" y="58" 
        text-anchor="middle" 
        dominant-baseline="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-weight="900" 
        font-size="23" 
        letter-spacing="-0.5px" 
        fill="#ffffff">FLS</text>
</svg>
